# Render Blueprint — deploying this repository creates the database and the
# service below, wired to each other, with nothing to paste by hand.
# See the storage section of README.md.

databases:
  - name: easy-school-db
    databaseName: easy_school
    user: easy_school
    # Same region as the service: that is what lets them talk over Render's
    # private network instead of the public internet.
    region: frankfurt
    # Check what Render's free database allows before relying on it — free
    # databases have carried an expiry date, after which they are removed.
    # Moving to a paid plan, or to another Postgres anywhere, is a change to
    # this line and nothing else: the application only ever reads DATABASE_URL.
    plan: free
    ipAllowList: []          # no public access; the service reaches it privately

services:
  - type: web
    name: school-on
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # The schema is applied and an empty database seeded before the server
    # accepts traffic. Both halves are idempotent — the schema only creates what
    # is missing, and the demo accounts go in only when there are no accounts at
    # all — so this is safe on every boot and can never overwrite real users.
    # Doing it here rather than in the build is deliberate: the connection
    # string is certainly present at run time.
    startCommand: npm run db:setup && npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Signs the session cookie. Render generates a random value on first
      # deploy, so nothing has to be pasted by hand.
      - key: AUTH_SECRET
        generateValue: true
      # Filled in from the database above — the password never appears in this
      # file, and never has to be copied through a dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: easy-school-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
